<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Drone visual-inertial odometry and 3D mapping workflow</title>
  <desc id="desc">A custom animated schematic shows monocular images and IMU measurements passing through a visual-inertial estimator to a 3D trajectory and landmark map. A small drone moves around an illustrative trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07172b"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142f4b"/><stop offset="1" stop-color="#0c2037"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4de1c1"/><stop offset="1" stop-color="#5bb8ff"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#a5c6dd" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6ebde9"/></marker>
  </defs>
  <rect width="1100" height="520" rx="26" fill="url(#bg)"/>
  <rect width="1100" height="520" rx="26" fill="url(#grid)"/>
  <path d="M32 83H1068" stroke="#35506a" stroke-width="1"/>
  <text x="42" y="43" fill="#f1f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">FROM SENSORS TO A SPATIAL MAP</text>
  <text x="43" y="65" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">MONOCULAR VISION  +  INERTIAL MOTION  →  ESTIMATED POSE  →  3D LANDMARKS</text>
  <!-- Stage cards -->
  <rect x="35" y="108" width="275" height="360" rx="18" fill="url(#card)" stroke="#355b78"/>
  <rect x="412" y="108" width="275" height="360" rx="18" fill="url(#card)" stroke="#355b78"/>
  <rect x="789" y="108" width="276" height="360" rx="18" fill="url(#card)" stroke="#355b78"/>
  <!-- Flow arrows -->
  <path d="M318 285H399" fill="none" stroke="#6ebde9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M695 285H776" fill="none" stroke="#6ebde9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle r="4" fill="#65e6ce" filter="url(#glow)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M318 285 H396"/></circle>
  <circle r="4" fill="#65e6ce" filter="url(#glow)"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M695 285 H773"/></circle>
  <!-- Sensor stage -->
  <text x="55" y="141" fill="#62e4ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">01 / INPUT SENSORS</text>
  <rect x="56" y="160" width="232" height="118" rx="10" fill="#081a2c" stroke="#365775"/>
  <rect x="70" y="176" width="85" height="72" rx="5" fill="#102b45" stroke="#5ab8e8"/>
  <path d="M78 231L97 206L111 219L130 189L148 231Z" fill="#2e5772" stroke="#5ab8e8" stroke-width="1.2"/>
  <circle cx="117" cy="194" r="5" fill="#ffe7a3"/>
  <circle cx="86" cy="188" r="2.5" fill="#65e6ce"/><circle cx="135" cy="204" r="2.5" fill="#65e6ce"/><circle cx="101" cy="225" r="2.5" fill="#65e6ce"/>
  <text x="171" y="192" fill="#eff7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Camera</text>
  <text x="171" y="210" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Frames</text>
  <text x="171" y="226" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Features</text>
  <text x="171" y="242" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Image motion</text>
  <rect x="56" y="295" width="232" height="114" rx="10" fill="#081a2c" stroke="#365775"/>
  <rect x="72" y="312" width="68" height="67" rx="8" fill="#102b45" stroke="#eabf68"/>
  <rect x="87" y="326" width="38" height="38" rx="7" fill="none" stroke="#eabf68" stroke-width="2"/>
  <path d="M106 319V371M80 345H132" stroke="#eabf68" stroke-width="1.5"/>
  <circle cx="106" cy="345" r="4" fill="#ffe7a3"/>
  <text x="155" y="323" fill="#eff7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">6-axis IMU</text>
  <text x="155" y="342" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Angular rate</text>
  <text x="155" y="358" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Specific force</text>
  <text x="155" y="374" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Time-stamped</text>
  <text x="56" y="438" fill="#8ca9c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Image and IMU timing must be aligned.</text>
  <!-- Estimator stage -->
  <text x="432" y="141" fill="#62e4ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">02 / VIO ESTIMATOR</text>
  <rect x="435" y="161" width="229" height="64" rx="10" fill="#0a1d31" stroke="#4680a6"/>
  <circle cx="458" cy="181" r="5" fill="#62e4ca"/><circle cx="473" cy="193" r="5" fill="#62e4ca"/><circle cx="491" cy="178" r="5" fill="#62e4ca"/>
  <path d="M458 181L473 193L491 178" fill="none" stroke="#62e4ca" stroke-width="1.5"/>
  <text x="508" y="184" fill="#eff7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Track features</text>
  <text x="508" y="201" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Across image frames</text>
  <path d="M550 226V244" stroke="#6ebde9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="435" y="250" width="229" height="64" rx="10" fill="#0a1d31" stroke="#4680a6"/>
  <path d="M455 278L466 265L478 281L490 268" stroke="#eabf68" stroke-width="2" fill="none"/>
  <text x="508" y="273" fill="#eff7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">IMU propagation</text>
  <text x="508" y="290" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Pose + covariance</text>
  <path d="M550 315V333" stroke="#6ebde9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="435" y="339" width="229" height="64" rx="10" fill="#0a1d31" stroke="#4680a6"/>
  <circle cx="464" cy="371" r="13" fill="none" stroke="#a998ff" stroke-width="1.7"/><path d="M454 371H474M464 361V381" stroke="#a998ff" stroke-width="1.4"/>
  <text x="488" y="364" fill="#eff7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Visual update</text>
  <text x="488" y="381" fill="#9db9cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Residuals + correction</text>
  <text x="435" y="438" fill="#8ca9c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Estimated pose ≠ guaranteed obstacle map.</text>
  <!-- Mapping stage -->
  <text x="809" y="141" fill="#62e4ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">03 / 3D WORLD VIEW</text>
  <path d="M829 376L1017 376M829 376L829 195M829 376L875 416" stroke="#6d91ac" stroke-opacity=".75" stroke-width="1.2" fill="none"/>
  <path d="M829 350L1017 350M829 324L1017 324M829 298L1017 298M829 272L1017 272M829 246L1017 246M829 220L1017 220" stroke="#57768e" stroke-opacity=".3" stroke-width="1"/>
  <path d="M865 190L865 386M901 190L901 386M937 190L937 386M973 190L973 386M1009 190L1009 386" stroke="#57768e" stroke-opacity=".25" stroke-width="1"/>
  <!-- Landmark cloud -->
  <g fill="#72edbd">
    <circle cx="860" cy="314" r="3"/><circle cx="877" cy="281" r="3"/><circle cx="895" cy="327" r="3"/><circle cx="907" cy="256" r="3"/><circle cx="925" cy="293" r="3"/><circle cx="943" cy="238" r="3"/><circle cx="962" cy="278" r="3"/><circle cx="985" cy="240" r="3"/><circle cx="1004" cy="304" r="3"/><circle cx="1020" cy="267" r="3"/>
    <circle cx="877" cy="352" r="2.5"/><circle cx="913" cy="343" r="2.5"/><circle cx="950" cy="326" r="2.5"/><circle cx="987" cy="346" r="2.5"/><circle cx="1008" cy="220" r="2.5"/>
  </g>
  <g fill="#72edbd" opacity=".5">
    <circle cx="860" cy="314" r="7"><animate attributeName="opacity" values=".12;.65;.12" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="943" cy="238" r="7"><animate attributeName="opacity" values=".12;.65;.12" dur="1.9s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="1004" cy="304" r="7"><animate attributeName="opacity" values=".12;.65;.12" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <path id="flight-path" d="M850 301 C860 242 903 214 945 233 S1012 292 985 323 S911 364 875 329 S842 313 850 301" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <g filter="url(#glow)">
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M850 301 C860 242 903 214 945 233 S1012 292 985 323 S911 364 875 329 S842 313 850 301"/>
      <circle r="13" fill="#2b81a8" fill-opacity=".25" stroke="#63d7ff" stroke-width="1.2"/>
      <path d="M-8 -4L0 -8L8 -4L8 4L0 8L-8 4Z" fill="#65e6ce" stroke="#e8ffff" stroke-width="1.2"/>
      <path d="M-12 0H12M0 -12V12" stroke="#e8ffff" stroke-width="1"/>
    </g>
  </g>
  <rect x="807" y="421" width="240" height="27" rx="13" fill="#102b45" stroke="#365775"/>
  <circle cx="824" cy="434" r="4" fill="#65e6ce"/><text x="836" y="438" fill="#d8ebf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Estimated path</text>
  <circle cx="935" cy="434" r="4" fill="#72edbd"/><text x="947" y="438" fill="#d8ebf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Landmarks</text>
  <text x="550" y="492" text-anchor="middle" fill="#7595ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">SCHEMATIC VISUALISATION • NOT LIVE TELEMETRY</text>
</svg>