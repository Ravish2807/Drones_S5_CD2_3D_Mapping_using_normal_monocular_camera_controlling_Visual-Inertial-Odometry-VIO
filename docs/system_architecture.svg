<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Drone control system architecture</title>
<desc id="desc">Animated flow from ArduPilot SITL and Gazebo through ROS 2 state topics and the SO(3) controller to velocity commands and diagnostics, with MATLAB experiments feeding the controller model offline.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9d1d9" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="500" rx="18" fill="#0b0e14"/><rect width="1200" height="500" rx="18" fill="url(#grid)"/>
<text x="42" y="45" fill="#7ee787" font-family="Consolas,monospace" font-size="13" letter-spacing="2.5">DRONE CONTROL PIPELINE</text>
<text x="42" y="82" fill="#e6edf3" font-family="Arial,sans-serif" font-size="23" font-weight="700">State → estimation → SO(3) control → command</text>
<g fill="none" stroke="#536174" stroke-width="2" stroke-dasharray="7 7">
 <path id="link1" d="M250 220H300"/><path id="link2" d="M545 220H595"/><path id="link3" d="M840 220H890"/>
 <path id="link4" d="M1015 310V365H840"/><path id="link5" d="M715 365V310"/>
</g>
<g fill="none" filter="url(#glow)">
 <circle r="5" fill="#74b9ff"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#link1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></circle>
 <circle r="5" fill="#a78bfa"><animateMotion dur="3s" begin=".65s" repeatCount="indefinite"><mpath href="#link2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin=".65s" repeatCount="indefinite"/></circle>
 <circle r="5" fill="#7ee787"><animateMotion dur="3s" begin="1.3s" repeatCount="indefinite"><mpath href="#link3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
 <circle r="4" fill="#fbbf24"><animateMotion dur="3.4s" begin="1s" repeatCount="indefinite"><mpath href="#link4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,sans-serif">
 <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".1s" fill="freeze"/><rect x="35" y="140" width="215" height="170" rx="14" fill="#161b22" stroke="#74b9ff" stroke-opacity=".65"/><text x="57" y="174" fill="#74b9ff" font-size="17" font-weight="700">1 · Simulation</text><text x="57" y="214" fill="#e6edf3" font-family="Consolas,monospace" font-size="13">ArduPilot SITL</text><text x="57" y="240" fill="#a1a1aa" font-size="13">Gazebo + sensors</text><text x="57" y="266" fill="#a1a1aa" font-size="13">Pose / twist / state</text></g>
 <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".4s" fill="freeze"/><rect x="300" y="140" width="245" height="170" rx="14" fill="#161b22" stroke="#a78bfa" stroke-opacity=".75"/><text x="322" y="174" fill="#a78bfa" font-size="17" font-weight="700">2 · ROS 2 / DDS</text><text x="322" y="214" fill="#e6edf3" font-family="Consolas,monospace" font-size="12">/ap/v1/pose/filtered</text><text x="322" y="240" fill="#e6edf3" font-family="Consolas,monospace" font-size="12">/ap/v1/twist/filtered</text><text x="322" y="266" fill="#a1a1aa" font-size="13">State transport</text></g>
 <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".7s" fill="freeze"/><rect x="595" y="140" width="245" height="170" rx="14" fill="#161b22" stroke="#7ee787" stroke-opacity=".75"/><text x="617" y="174" fill="#7ee787" font-size="17" font-weight="700">3 · SO(3) controller</text><text x="617" y="214" fill="#a1a1aa" font-size="13">Position / velocity errors</text><text x="617" y="240" fill="#a1a1aa" font-size="13">Desired force + attitude</text><text x="617" y="266" fill="#a1a1aa" font-size="13">Geometric moment control</text></g>
 <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1s" fill="freeze"/><rect x="890" y="140" width="275" height="170" rx="14" fill="#161b22" stroke="#7ee787" stroke-opacity=".75"/><text x="912" y="174" fill="#7ee787" font-size="17" font-weight="700">4 · Outputs</text><text x="912" y="214" fill="#e6edf3" font-family="Consolas,monospace" font-size="13">/ap/v1/cmd_vel</text><text x="912" y="240" fill="#a1a1aa" font-size="13">Velocity command interface</text><text x="912" y="266" fill="#a1a1aa" font-size="13">Diagnostics + attitude</text></g>
 <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.25s" fill="freeze"/><rect x="595" y="340" width="245" height="65" rx="13" fill="#161b22" stroke="#74b9ff" stroke-opacity=".7"/><text x="617" y="367" fill="#74b9ff" font-size="15" font-weight="700">MATLAB Live Scripts</text><text x="617" y="389" fill="#a1a1aa" font-size="12">Offline modelling &amp; experiments</text></g>
</g>
<text x="42" y="460" fill="#8b949e" font-family="Consolas,monospace" font-size="12">Command publishing is gated by enable_command · verify simulation and frames before enabling.</text>
</svg>
