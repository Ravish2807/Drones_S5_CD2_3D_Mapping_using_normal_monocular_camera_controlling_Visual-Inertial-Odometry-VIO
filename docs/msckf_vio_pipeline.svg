<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Monocular MSCKF-VIO — 3D Mapping Pipeline</title>
<desc id="desc">Animated architecture showing camera and IMU inputs, feature tracking and inertial propagation, central state estimation, ZUPT correction, camera pose, 3D landmarks and visualization.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091423"/><stop offset="1" stop-color="#101d32"/></linearGradient>
<linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b52"/><stop offset="1" stop-color="#15596b"/></linearGradient>
<linearGradient id="vision" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262f57"/><stop offset="1" stop-color="#373c70"/></linearGradient>
<linearGradient id="estimator" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#303c70"/><stop offset="1" stop-color="#48468a"/></linearGradient>
<linearGradient id="output" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12463f"/><stop offset="1" stop-color="#176254"/></linearGradient>
<filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000814" flood-opacity=".3"/></filter>
<filter id="glow" x="-150%" y="-150%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#91a9ca"/></marker>
<marker id="arrowVisual" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8bdcff"/></marker>
<marker id="arrowInertial" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8adbd2"/></marker>
<marker id="arrowOutput" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7de0bc"/></marker>
<style>
text{font-family:Inter,"Segoe UI",Arial,sans-serif}.heading{font-size:27px;font-weight:750;fill:#f2f6ff;letter-spacing:-.4px}.subtitle{font-size:13px;fill:#9fb2ce}.section{font-size:12px;font-weight:750;letter-spacing:1.4px;fill:#d7e4f7}.number{font-size:10px;font-weight:750;fill:#b9c9e4;text-anchor:middle}.node-title{font-size:15px;font-weight:700;fill:#f5f8ff;text-anchor:middle}.node-sub{font-size:11.5px;fill:#d3e0f2;text-anchor:middle}.node-detail{font-size:10.5px;fill:#aebfda;text-anchor:middle}.panel{stroke-width:1}.card{stroke-width:1.2;stroke-opacity:.9;filter:url(#shadow)}.camera-card,.imu-card{fill:url(#sensor);stroke:#4c9db5}.process-card{fill:url(#vision);stroke:#777fba}.estimator-card{fill:url(#estimator);stroke:#a0a8f1}.zupt-card{fill:#342d55;stroke:#a28cd8}.output-card{fill:url(#output);stroke:#4db89c}.display-card{fill:#173d4c;stroke:#468ca1}
.connector{fill:none;stroke:#91a9ca;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.visual-line{stroke:#8bdcff;marker-end:url(#arrowVisual)}.imu-line{stroke:#8adbd2;marker-end:url(#arrowInertial)}.output-line{stroke:#7de0bc;marker-end:url(#arrowOutput)}.animated{stroke-dasharray:5 8;animation:flow 2.4s linear infinite}.slow{animation-duration:3.3s}.accent{fill:none;stroke-width:2;stroke-linecap:round;animation:pulse 3s ease-in-out infinite}.dot{animation:dotPulse 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-52}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dotPulse{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){.animated,.accent,.dot{animation:none}}
</style></defs>
<rect width="1200" height="720" rx="18" fill="url(#bg)"/><circle cx="1100" cy="60" r="180" fill="#24486e" opacity=".09"/><circle cx="70" cy="680" r="180" fill="#14566a" opacity=".07"/><path d="M0 105 H1200" stroke="#31425d" stroke-opacity=".65"/>
<text x="42" y="49" class="heading">Monocular MSCKF-VIO · 3D Mapping</text><text x="44" y="75" class="subtitle">Visual–inertial fusion · Camera pose estimation · Spatial landmark reconstruction</text><rect x="1020" y="30" width="136" height="30" rx="15" fill="#142d37" stroke="#2b7768"/><circle cx="1037" cy="45" r="4" fill="#70e0b7" class="dot"/><text x="1048" y="49" font-size="10.5" font-weight="700" fill="#a5ebd1">DATA PIPELINE</text>
<rect class="panel" x="35" y="133" width="235" height="472" rx="16" fill="#10283a" stroke="#244e67"/><rect class="panel" x="295" y="133" width="580" height="472" rx="16" fill="#191f3b" stroke="#373f6c"/><rect class="panel" x="900" y="133" width="265" height="472" rx="16" fill="#102d2c" stroke="#285d54"/>
<circle cx="55" cy="158" r="11" fill="#1c526a"/><text x="55" y="162" class="number">01</text><text x="74" y="162" class="section">SENSOR INPUTS</text><circle cx="315" cy="158" r="11" fill="#353e75"/><text x="315" y="162" class="number">02</text><text x="334" y="162" class="section">VIO PROCESSING</text><circle cx="920" cy="158" r="11" fill="#1c6254"/><text x="920" y="162" class="number">03</text><text x="939" y="162" class="section">OUTPUTS</text>
<!-- Camera --><rect class="card camera-card" x="57" y="205" width="191" height="100" rx="12"/><g transform="translate(72 218)" stroke="#9be6f5" stroke-width="1.6" stroke-linejoin="round" fill="none"><rect x="0" y="3" width="19" height="14" rx="3"/><path d="M19 7 L25 4 V16 L19 13 Z"/><circle cx="9" cy="10" r="3.5"/></g><text x="157" y="240" class="node-title">Monocular Camera</text><text x="152" y="266" class="node-sub">Image frames</text><text x="152" y="285" class="node-detail">Visual input · 30 Hz</text>
<!-- IMU --><rect class="card imu-card" x="57" y="405" width="191" height="100" rx="12"/><g transform="translate(73 418)" stroke="#a6eee1" stroke-width="1.6" fill="none" stroke-linecap="round"><rect x="0" y="0" width="21" height="21" rx="4"/><path d="M10.5 4 V17 M4 10.5 H17"/><circle cx="10.5" cy="10.5" r="3"/></g><text x="157" y="441" class="node-title">6-Axis IMU</text><text x="152" y="467" class="node-sub">Acceleration + angular rate</text><text x="152" y="486" class="node-detail">Inertial input · 200 Hz</text><text x="152" y="550" class="node-detail">Independent sensor streams</text><text x="152" y="568" class="node-detail">feed the VIO estimator</text>
<!-- Feature tracking --><rect class="card process-card" x="325" y="205" width="210" height="105" rx="12"/><g transform="translate(339 218)" stroke="#c1ccff" stroke-width="1.5" fill="none"><rect x="0" y="0" width="22" height="20" rx="3"/><circle cx="5" cy="5" r="1.6" fill="#c1ccff"/><circle cx="16" cy="5" r="1.6" fill="#c1ccff"/><circle cx="11" cy="15" r="1.6" fill="#c1ccff"/><path d="M5 5 L11 15 L16 5" stroke-dasharray="2 2"/></g><text x="430" y="240" class="node-title">KLT Feature Tracking</text><text x="430" y="266" class="node-sub">FAST corner detection</text><text x="430" y="285" class="node-detail">Track features across frames</text>
<!-- Inertial propagation --><rect class="card process-card" x="325" y="405" width="210" height="100" rx="12"/><g transform="translate(340 423)" stroke="#c1ccff" stroke-width="1.5" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M11 0 V22 M0 11 H22 M7 4 L11 0 L15 4 M18 7 L22 11 L18 15"/></g><text x="430" y="440" class="node-title">IMU Propagation</text><text x="430" y="466" class="node-sub">Integrate angular velocity</text><text x="430" y="485" class="node-detail">Predict state and covariance</text>
<!-- Estimator --><rect class="card estimator-card" x="625" y="260" width="225" height="145" rx="14"/><path class="accent" d="M643 282 H832" stroke="#c4cbff"/><text x="737" y="306" class="node-title">15-State Error-State KF</text><text x="737" y="333" class="node-sub">Visual–inertial correction</text><text x="737" y="354" class="node-sub">Sliding-window state</text><text x="737" y="375" class="node-detail">Pose · Velocity · IMU biases</text>
<!-- ZUPT --><rect class="card zupt-card" x="625" y="460" width="225" height="82" rx="12"/><g transform="translate(628 482)" stroke="#d2c4ff" stroke-width="1.5" fill="none" stroke-linecap="round"><circle cx="10" cy="10" r="9"/><path d="M3 10 H17 M6 5 V15 M14 5 V15"/></g><text x="738" y="489" class="node-title">ZUPT Correction</text><text x="738" y="512" class="node-sub">Zero-velocity update</text><text x="738" y="529" class="node-detail">When stationary is detected</text>
<!-- Camera pose --><rect class="card output-card" x="924" y="205" width="217" height="95" rx="12"/><g transform="translate(940 219)" stroke="#9ef0d3" stroke-width="1.5" fill="none" stroke-linecap="round"><path d="M0 18 V0 H18"/><path d="M0 18 H13 V5"/><path d="M13 5 L9 9 M13 5 L17 9"/></g><text x="1041" y="240" class="node-title">Camera Pose</text><text x="1041" y="264" class="node-sub">Position + orientation</text><text x="1041" y="283" class="node-detail">Trajectory · TUM / CSV</text>
<!-- Landmark map --><rect class="card output-card" x="924" y="350" width="217" height="95" rx="12"/><g transform="translate(941 367)" stroke="#9ef0d3" stroke-width="1.4" fill="none" stroke-linejoin="round"><path d="M0 6 L10 0 L20 6 L10 12 Z"/><path d="M0 6 V17 L10 23 L20 17 V6 M10 12 V23"/></g><text x="1042" y="384" class="node-title">3D Landmark Map</text><text x="1042" y="408" class="node-sub">Triangulated feature points</text><text x="1042" y="427" class="node-detail">Spatial reconstruction</text>
<!-- Visualization --><rect class="card display-card" x="924" y="495" width="217" height="72" rx="12"/><g transform="translate(941 512)" stroke="#9cdff0" stroke-width="1.6" fill="none"><rect x="0" y="0" width="23" height="17" rx="2"/><path d="M5 22 H18 M11.5 17 V22 M4 12 L9 6 L14 10 L19 4"/></g><text x="1043" y="525" class="node-title">3D Visualization</text><text x="1043" y="548" class="node-sub">RViz2 · Open3D</text>
<!-- Separate visual and inertial routes --><path class="connector visual-line animated" d="M248 255 H282 V257 H325"/><path class="connector visual-line animated slow" d="M535 257 H585 V305 H625"/><path class="connector imu-line animated slow" d="M248 455 H282 V455 H325"/><path class="connector imu-line animated" d="M535 455 H590 V365 H625"/>
<!-- Estimator outputs --><path class="connector output-line animated" d="M850 305 H884 V252 H924"/><path class="connector output-line animated slow" d="M850 365 H884 V397 H924"/>
<!-- ZUPT feedback route --><path class="connector animated slow" d="M625 501 H603 V585 H863 V425 H815 V405"/>
<!-- Map to visualization only --><path class="connector animated" d="M1032 445 V495"/>
<!-- Animated particles --><circle r="4.5" fill="#9de8ff" filter="url(#glow)"><animateMotion dur="2.7s" repeatCount="indefinite" path="M248 255 H282 V257 H325"/></circle><circle r="4.5" fill="#9de8ff" filter="url(#glow)"><animateMotion dur="3.1s" begin=".7s" repeatCount="indefinite" path="M535 257 H585 V305 H625"/></circle><circle r="4.5" fill="#8adbd2" filter="url(#glow)"><animateMotion dur="3.3s" begin=".4s" repeatCount="indefinite" path="M248 455 H282 V455 H325"/></circle><circle r="4.5" fill="#8adbd2" filter="url(#glow)"><animateMotion dur="3.5s" begin="1s" repeatCount="indefinite" path="M535 455 H590 V365 H625"/></circle><circle r="4.5" fill="#83f0c2" filter="url(#glow)"><animateMotion dur="3.2s" begin=".8s" repeatCount="indefinite" path="M850 305 H884 V252 H924"/></circle><circle r="4.5" fill="#83f0c2" filter="url(#glow)"><animateMotion dur="3.5s" begin="1.6s" repeatCount="indefinite" path="M850 365 H884 V397 H924"/></circle>
<!-- Footer --><path d="M42 633 H1158" stroke="#31425d" stroke-opacity=".7"/><circle cx="54" cy="658" r="4" fill="#9de8ff"/><text x="67" y="662" font-size="11" fill="#aebfda">Visual data</text><circle cx="166" cy="658" r="4" fill="#8adbd2"/><text x="179" y="662" font-size="11" fill="#aebfda">Inertial data</text><circle cx="292" cy="658" r="4" fill="#83f0c2"/><text x="305" y="662" font-size="11" fill="#aebfda">Estimated outputs</text><path d="M450 658 H486" stroke="#91a9ca" stroke-width="2" stroke-dasharray="5 5"/><text x="496" y="662" font-size="11" fill="#aebfda">Animated data flow</text><text x="1155" y="662" text-anchor="end" font-size="11" fill="#8298b7">MSCKF-VIO · 3D SPATIAL MAPPING</text>
</svg>