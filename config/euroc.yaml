# Configuration for EuRoC MAV Dataset (e.g. MH_01_easy, V1_01_easy)

camera:
  fps: 20.0
  width: 752
  height: 480
  intrinsics:
    fx: 458.654
    fy: 457.296
    cx: 367.215
    cy: 248.375
  distortion:
    model: "radtan"
    k1: -0.28340811
    k2: 0.07395907
    p1: 0.00019359
    p2: 0.000017618

extrinsics:
  # T_BS (Camera to Body/IMU)
  R_BC: [
    [0.0148655429818, -0.999880929698, 0.0041402967942],
    [0.999557246384, 0.0149672133247, 0.025715529948],
    [-0.0257744366974, 0.00375618835797, 0.999660727178]
  ]
  p_BC: [-0.0216401454975, -0.064676986768, 0.00981073058949]

imu:
  rate_hz: 200.0
  noise_accel: 2.0000e-03        # m/s^2 / sqrt(Hz)
  noise_gyro: 1.6968e-04         # rad/s / sqrt(Hz)
  random_walk_accel: 3.0000e-03  # m/s^3 / sqrt(Hz)
  random_walk_gyro: 1.9393e-05   # rad/s^2 / sqrt(Hz)

estimator:
  max_clones: 10
  min_track_length: 3
  max_features: 150
  fast_threshold: 20
  grid_rows: 4
  grid_cols: 5
  init_time_seconds: 1.0
  gravity: [0.0, 0.0, -9.81]
