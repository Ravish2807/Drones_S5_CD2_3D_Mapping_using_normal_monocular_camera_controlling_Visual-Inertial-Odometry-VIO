model2_dmdc_controller:
  ros__parameters:

    # Control loop frequency (Hz)
    rate: 25.0

    # Topic configuration
    pose_topic: "/ap/v1/pose/filtered"
    twist_topic: "/ap/v1/twist/filtered"
    cmd_vel_topic: "/ap/v1/cmd_vel"
    status_topic: "/ap/v1/status"
    target_topic: "/drones_controller/target_pose"

    # Optimal Control Branch: "mpc" (finite horizon constrained) or "lqr" (steady state DARE)
    control_mode: "mpc"

    # Default Target setpoint (hover 5m)
    target:
      x: 0.0
      y: 0.0
      z: 5.0
      yaw: 0.0

    # Limits and tolerances
    limits:
      max_velocity: 2.5
      position_tolerance: 0.10
      velocity_tolerance: 0.05
      min_takeoff_altitude: 0.50

    # Safety settings
    safety:
      state_timeout: 0.2
      enable_command: true

    # Physical parameters
    mass: 1.5
    gravity: 9.81
    inertia: [0.02, 0.02, 0.04]

    # Block 2: DMDc System Identification settings
    dmdc:
      window_size: 100
      min_samples: 25

    # Blocks 7–9: MPC settings (Horizon N=25 steps, ~1.0s)
    mpc:
      horizon: 25
      # Q weights: [p_x, p_y, p_z, v_x, v_y, v_z, theta_x, theta_y, theta_z, w_x, w_y, w_z]
      q_pos: [10.0, 10.0, 20.0]
      q_vel: [2.0, 2.0, 5.0]
      q_rot: [5.0, 5.0, 2.0]
      q_omega: [0.5, 0.5, 0.2]
      # R weights: [thrust_deviation, tau_x, tau_y, tau_z]
      r_weights: [0.1, 1.0, 1.0, 1.0]
